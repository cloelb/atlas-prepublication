name: Inspection temporaire interface Compte
on:
  push:
    branches: [simplifier-compte-2026-11-03]
permissions:
  contents: read
jobs:
  inspecter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Details des fonctions et des boutons Compte
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          c=Path("index.html").read_text(encoding="utf8")
          terms=["function settings()", "function auth", "function header(", "function footer(", "data-action=\"settings\"", "data-action=\"auth\"", "auth-form", "case 'settings'", "case 'auth'", "case 'signout'", "function modal(", "function afterAuth", "function cloudStatus", "function render("]
          for term in terms:
              indices=[m.start() for m in re.finditer(re.escape(term),c,re.I)]
              print("TERM",repr(term),"N",len(indices))
              for x in indices[:4]:
                  fragment=c[max(0,x-280):min(len(c),x+6500)]
                  fragment=re.sub(r"(?i)(sb_publishable_[a-z0-9_\-]+|eyJ[A-Za-z0-9_\-]{70,})","[REDACTED]",fragment)
                  print("BLOCK",repr(fragment))
          PY
