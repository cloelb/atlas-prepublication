name: Simplifier la connexion (temporaire)
on:
  push:
    branches: [simplifier-compte-2026-11-03]
permissions:
  contents: write
jobs:
  modifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Modifier et verifier l interface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path("index.html")
          c=p.read_text(encoding="utf-8")
          assert c.count("function settings(){")==1
          assert c.count("\n// V25 : ne jamais")==1
          new_modals="""function settings(mode='signup'){
           if(!session){auth(mode==='signin'?'signin':'signup');return;}
           const email=session.email?`<p class="muted text-sm">Adresse e-mail : ${h(session.email)}</p>`:'';
           const conflict=cloudConflict?'<button class="btn outline" data-action="compare-cloud">Choisir la bonne version de mon Atlas</button>':'';
           const guest=hasAtlasContent(loadLocal())?'<button class="btn outline" data-action="import-guest">Récupérer mes souvenirs de cet appareil</button>':'';
           modal('Mon compte','Mon Atlas',email+`<p class="muted text-sm">${h(cloudStatus())}</p><div class="actions">${conflict}${guest}<button class="btn outline" data-action="signout">Se déconnecter</button></div>`);
          }
          function auth(mode='signup'){
           if(!cloud)return notify('Connexion aux comptes temporairement indisponible.');
           const create=mode!=='signin';
           modal(create?'Créer mon compte':'Se connecter','Mon Atlas',
            `<p>${create?'Un compte personnel pour retrouver ton Atlas sur tes appareils.':'Retrouve ton Atlas et poursuis ton chemin.'}</p>
            <form id="auth-form">
             <input name="intent" type="hidden" value="${create?'signup':'signin'}">
             <div class="form-row"><label for="atlas-auth-email">Adresse e-mail</label><input id="atlas-auth-email" required name="email" type="email" autocomplete="email"></div>
             <div class="form-row"><label for="atlas-auth-password">Mot de passe</label><input id="atlas-auth-password" required name="password" type="password" autocomplete="${create?'new-password':'current-password'}" minlength="${create?'10':'1'}"></div>
             <button class="btn" type="submit">${create?'Créer mon compte':'Se connecter'}</button>
            </form>
            ${create?'<p class="muted text-sm">Tu recevras peut-être un e-mail pour confirmer ton inscription.</p>':''}`);
          }
          """
          a=c.index("function settings(){")
          b=c.index("\n// V25 : ne jamais",a)
          c=c[:a]+new_modals+c[b:]
          old="else if(type==='settings')settings();"
          assert c.count(old)==1
          c=c.replace(old,"else if(type==='settings')settings(a.dataset.mode||'signup');",1)
          old_footer=' &nbsp;·&nbsp; <button class="footer-settings" type="button" data-action="settings">Compte et sauvegarde</button>'
          assert c.count(old_footer)==1
          c=c.replace(old_footer,"",1)
          c=c.replace('>Compte et sauvegarde</button>','>Mon compte</button>')
          wrapper="""const originalHeader=header;
          header=function(active){
           const html=originalHeader(active);
           const accountActions=session
             ?'<button type="button" class="v12-account" data-action="settings" aria-label="Mon compte">◉ <span>Mon compte</span></button>'
             :'<button type="button" class="v12-account" data-action="settings" data-mode="signin">Se connecter</button><button type="button" class="v12-account v12-account-create" data-action="settings" data-mode="signup">Créer mon compte</button>';
           return html.replace('<div class="top-actions">','<div class="top-actions">'+accountActions);
          };
          """
          pattern=r'const originalHeader=header;\s*header=function\(active\)\{.*?\n\};'
          c,n=re.subn(pattern,lambda _:wrapper,c,count=1,flags=re.S)
          assert n==1,"Surcharge de l'entête introuvable"
          css="""<style>
          /* Acces aux comptes : visible et simple, y compris sur telephone */
          .site-top .top-actions {gap:8px;}
          .site-top .v12-account-create {background:#1e392b;color:#f7efe0;border-color:#1e392b;}
          @media (max-width:760px) {
           .site-top .v12-account {font-size:12px; padding:9px 11px;white-space:nowrap;}
           .site-top .top-actions > a {display:none;}
          }
          </style>
          """
          assert c.count("</head>")==1
          c=c.replace("</head>",css+"</head>",1)
          assert "Mes souvenirs et mon compte." not in c
          assert c.count('data-mode="signin"')==1 and c.count('data-mode="signup"')==1
          assert "function auth(mode='signup')" in c
          assert c.count("atlas-auth-email")==2
          assert len(c)>3000000
          p.write_text(c,encoding="utf-8")
          for i,m in enumerate(re.finditer(r'<script\b([^>]*)>(.*?)</script\s*>',c,re.I|re.S)):
              attrs,code=m.groups()
              if re.search(r'\bsrc\s*=',attrs,re.I) or not code.strip():continue
              target=Path("/tmp/atlas-check-"+str(i)+".js")
              target.write_text(code,encoding="utf8")
              v=subprocess.run(["node","--check",str(target)],capture_output=True,text=True)
              if v.returncode:
                 print("ERROR_JS_SCRIPT",i,v.stderr[:4000])
                 raise SystemExit(1)
          print("PATCH_OK len="+str(len(c))+" all_inline_scripts_valid")
          PY
      - name: Enregistrer uniquement l interface
        run: |
          git rm .github/workflows/inspecter-compte-temp.yml
          git add index.html
          git diff --cached --check
          git config user.name 'atlas-ui-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Simplifie inscription et connexion sans toucher aux sauvegardes'
          git push
