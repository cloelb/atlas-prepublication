name: Verifier les changements Atlas
on:
  push:
    branches:
      - feature/edition-missions-comptes-2026-11-04
      - feature/atlas-missions-vivantes-reflexions-2026-11-04
      - main
  pull_request:
    branches:
      - main
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier la syntaxe JavaScript
        run: node --check assets/atlas-missions-comptes.js
      - name: Tester les missions et la connexion
        run: node tests/atlas-feature-smoke.cjs
      - name: Vérifier la nouvelle interface publique
        run: |
          node --check assets/atlas-public-journey.js
          node tests/atlas-public-journey-smoke.cjs
          node --check assets/atlas-public-sync.js
          node tests/atlas-public-sync-smoke.cjs
          node tests/atlas-public-navigation-smoke.cjs
      - name: Vérifier Ma semaine et les illustrations externalisées
        run: |
          node --check assets/atlas-weekly.js
          node tests/atlas-weekly-smoke.cjs
          node -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');if(html.includes('data:image/webp;base64,'))throw Error('Illustrations WebP encore intégrées');if(!html.includes('assets/atlas-weekly.js'))throw Error('Ma semaine non chargée');if(!html.includes('noindex,nofollow'))throw Error('Prépublication non protégée');"
      - name: Vérifier le menu Objectifs et les alertes de synchronisation
        run: node tests/atlas-objectifs-sync-warning.cjs
      - name: Simuler deux téléphones et un conflit de sauvegarde
        run: node tests/atlas-two-devices-sync.cjs
      - name: Vérifier la fidélisation J+7, les campagnes Instagram et le consentement
        run: |
          node --check assets/atlas-analytics.js
          node tests/atlas-analytics-smoke.cjs
      - name: Tester l’Atlas public et la confidentialité
        run: node tests/atlas-publication-smoke.cjs
      - name: Verifier le chargement et les controles de securite
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const js=fs.readFileSync('assets/atlas-missions-comptes.js','utf8');if(!html.includes('<script src=\"assets/atlas-missions-comptes.js\"></script>'))throw Error('Script non charge');for(const required of ['needsAccount','missionControls','atlas-v29-insert-form','atlas-v29-mission-form','atlas-v29-step-form','atlas-v29-danger'])if(!js.includes(required))throw Error('Fonction manquante: '+required);"
