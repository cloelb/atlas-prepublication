/* Scene one: the ORIGINAL approved art is untouched. Only optical layers animate. */
.hero{background:#e9dbc5;isolation:isolate;position:relative}
.hero img.original{will-change:clip-path;transform-origin:50% 45%;}
.hero.v8-inview img.original{animation:v8HeroUnfold 1.65s var(--v8-ease) both}
.hero::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,#fff8e7 0%,#dfc8a5 86%)}
.hero.v8-inview::before{animation:v8VeilLift 1.9s ease-out both}

.hero.v8-inview .hero-mobile-content .smallcaps{animation:v8FadeFocus .72s .75s both}
.hero.v8-inview .hero-mobile-content h1{animation:v8CharcoalReveal 1.18s .85s var(--v8-ease) both}
.hero.v8-inview .hero-mobile-content p{animation:v8FadeFocus 1.1s 1.35s both}
.hero.v8-inview .hero-mobile-content .btn{animation:v8Press .7s 1.9s var(--v8-emph) both}
.hero-enter-hit{transition:background-color .2s ease,box-shadow .4s ease}

.wayfinder-needle{position:absolute;inset:19px 34px;transform-origin:center;background:linear-gradient(#e8c389 0 50%,#455646 50% 100%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

.territory-chapter a{perspective:700px;transform-origin:center bottom;isolation:isolate}

.todo-board.v8-inview:nth-child(2){animation-delay:100ms}.todo-board.v8-inview:nth-child(3){animation-delay:200ms}.todo-board.v8-inview:nth-child(4){animation-delay:300ms}

.btn{position:relative;transition:transform .2s var(--v8-emph),background-color .25s,box-shadow .3s}

<script>
const TERRITORY_ASSETS={"autonomie": "assets/art-03.webp", "corps": "assets/art-04.webp", "esprit": "assets/art-05.webp", "savoir": "assets/art-06.webp"};
/** ATLAS — domaine indépendant de l'interface. Aucune notion de score ou streak punitif. */
const TERRITORIES = Object.freeze({
 autonomie:{name:'Autonomie',motto:'Choisir sa liberté',symbol:'⌂'},
 corps:{name:'Corps',motto:'Habiter son corps',symbol:'☼'},
 esprit:{name:'Esprit',motto:'Cultiver sa pensée',symbol:'✦'},
 savoir:{name:'Savoir-faire',motto:'Apprendre par le geste',symbol:'✳'}
});
const HORIZONS={day:'Aujourd’hui',week:'Cette semaine',month:'Ce mois-ci',long:'À long terme'};
const uuid=()=>globalThis.crypto?.randomUUID?.()||`a${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`;
const iso=()=>new Date().toISOString();
const blank=()=>({schema:6,cap:'',capHistory:[],missions:[],actions:[],notes:[],bookmarks:[],history:[],essays:[],checkins:[],createdAt:iso(),updatedAt:iso()});
function validState(data){if(!data||typeof data!=='object'||!Array.isArray(data.missions)||!Array.isArray(data.actions)||!Array.isArray(data.notes))return blank();const base={...blank(),...data,missions:data.missions,actions:data.actions,notes:data.notes,capHistory:Array.isArray(data.capHistory)?data.capHistory:[],bookmarks:Array.isArray(data.bookmarks)?data.bookmarks:[],history:Array.isArray(data.history)?data.history:[],essays:Array.isArray(data.essays)?data.essays:[],checkins:Array.isArray(data.checkins)?data.checkins:[]};base.bookmarks=(base.bookmarks||[]).map(b=>({pagesTotal:0,currentPage:0,entries:[],highlights:[],...b,entries:Array.isArray(b.entries)?b.entries:[],highlights:Array.isArray(b.highlights)?b.highlights:[]}));return base;}
const log=(s,kind,description,meta={})=>{s.history.unshift({id:uuid(),date:iso(),kind,description,...meta});};
function updateCap(state,cap){const s=structuredClone(state);const next=cap.trim().slice(0,500);if(next!==s.cap){if(s.cap)s.capHistory.unshift({id:uuid(),value:s.cap,date:iso()});s.cap=next;log(s,'cap','Mon Cap a évolué');}return s;}
function createMission(state,{title,territory='esprit',mode='guided',why='',steps=[]}){
 const clean=title.trim().slice(0,100);if(!clean)throw Error('Donne un nom à ta Mission.');if(!TERRITORIES[territory])throw Error('Territoire inconnu.');
 const s=structuredClone(state);const m={id:uuid(),title:clean,territory,mode:mode==='free'?'free':'guided',why:why.trim().slice(0,800),createdAt:iso(),completedAt:null,steps:steps.map(x=>x.trim()).filter(Boolean).slice(0,24).map(title=>({id:uuid(),title:title.slice(0,160),doneAt:null})),reflections:[]};
 s.missions.unshift(m);log(s,'mission',`Nouvelle Mission : ${clean}`,{missionId:m.id});return {state:s,mission:m};
}
function addStep(state,missionId,title){const s=structuredClone(state),m=s.missions.find(x=>x.id===missionId);if(!m)throw Error('Mission introuvable');const text=title.trim();if(!text)throw Error('Décris ton étape');m.steps.push({id:uuid(),title:text.slice(0,160),doneAt:null});m.completedAt=null;return s;}
function stepCanOpen(m,index){return m.mode==='free'||index===0||m.steps.slice(0,index).every(s=>Boolean(s.doneAt));}
function setStep(state,missionId,stepId,done){const s=structuredClone(state);const m=s.missions.find(x=>x.id===missionId);if(!m)throw Error('Mission introuvable');const wasCompleted=Boolean(m.completedAt);const idx=m.steps.findIndex(x=>x.id===stepId);if(idx<0)throw Error('Étape introuvable');const st=m.steps[idx];if(done&&!stepCanOpen(m,idx))throw Error('Ce passage n’est pas encore accessible.');if(done&&!st.doneAt){st.doneAt=iso();log(s,'step',`Étape franchie : ${st.title}`,{missionId:m.id,stepId:st.id});}if(!done&&st.doneAt){st.doneAt=null;log(s,'step','Une étape a été réouverte',{missionId:m.id,stepId:st.id});if(m.mode==='guided'){for(let i=idx+1;i<m.steps.length;i++)m.steps[i].doneAt=null;}}m.completedAt=(m.steps.length>0&&m.steps.every(x=>x.doneAt))?(m.completedAt||iso()):null;if(m.completedAt&&!wasCompleted)log(s,'completed',`Mission accomplie : ${m.title}`,{missionId:m.id});return s;}
function progress(m){let done=m.steps.filter(x=>x.doneAt).length;return {done,total:m.steps.length,percent:m.steps.length?Math.round(done/m.steps.length*100):0,finished:Boolean(m.completedAt)};}
function nextStep(m){return m.steps.find((s,i)=>!s.doneAt&&stepCanOpen(m,i));}
function addNote(state,{text,emotion='curiosité',missionId=null,image=null,kind='journal'}){if(!text.trim()&&!image)throw Error('Écris une pensée ou ajoute une image');const s=structuredClone(state);s.notes.unshift({id:uuid(),text:text.trim().slice(0,8000),emotion:emotion.slice(0,30),missionId:missionId||null,image,kind,date:iso()});log(s,'journal','Un souvenir est entré dans le Carnet',{missionId});return s;}
function addAction(state,{title,horizon='day',missionId=null}){const s=structuredClone(state);if(!title.trim())throw Error('Donne un nom à ton action.');if(!HORIZONS[horizon])throw Error('Horizon inconnu');s.actions.unshift({id:uuid(),title:title.trim().slice(0,160),horizon,missionId,createdAt:iso(),doneDates:[],archived:false});return s;}
function periodKey(horizon,at=new Date()){const dt=new Date(at);const y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate();if(horizon==='long')return 'long';if(horizon==='month')return `${y}-${String(m).padStart(2,'0')}`;if(horizon==='day')return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const jan4=new Date(y,0,4);const current=new Date(y,dt.getMonth(),dt.getDate());const day=(current.getDay()+6)%7;current.setDate(current.getDate()-day+3);const first=new Date(current.getFullYear(),0,4);const firstDay=(first.getDay()+6)%7;first.setDate(first.getDate()-firstDay+3);let week=1+Math.round((current-first)/604800000);return `${current.getFullYear()}-W${String(week).padStart(2,'0')}`;}
function isActionDone(action,at=new Date()){return action.doneDates.includes(periodKey(action.horizon,at));}
function toggleAction(state,actionId,at=new Date()){const s=structuredClone(state),a=s.actions.find(x=>x.id===actionId);if(!a)throw Error('Action introuvable');const key=periodKey(a.horizon,at);if(a.doneDates.includes(key))a.doneDates=a.doneDates.filter(k=>k!==key);else {a.doneDates.push(key);log(s,'action',`Petit pas accompli : ${a.title}`,{actionId:a.id});}return s;}
function markRecovery(state,missionId,reason,plan){const s=structuredClone(state),m=s.missions.find(x=>x.id===missionId);if(!m)throw Error('Mission introuvable');m.reflections.push({id:uuid(),type:'recovery',date:iso(),reason:reason.slice(0,120),plan:plan.slice(0,800)});log(s,'restart',`J’ai choisi de reprendre : ${m.title}`,{missionId});return s;}
function addBook(state,title,author='',stateName='to-read',cover=null,pagesTotal=0,currentPage=0){
 if(!title.trim())throw Error('Précise le titre du livre.');
 const total=Math.max(0,Math.floor(Number(pagesTotal)||0));let current=Math.max(0,Math.floor(Number(currentPage)||0));
 if(total)current=Math.min(current,total);
 const s=structuredClone(state),status=stateName==='finished'||(total&&current>=total)?'finished':current>0?'reading':stateName;if(status==='finished'&&total)current=total;
 s.bookmarks.unshift({id:uuid(),title:title.trim().slice(0,180),author:author.trim().slice(0,100),status,cover:cover&&/^data:image\/jpeg;base64,/.test(cover)?cover:null,note:'',pagesTotal:total,currentPage:current,entries:[],addedAt:iso()});
 log(s,'book',`Livre ajouté à ma bibliothèque : ${title.trim().slice(0,180)}`);return s;
}
function bookLabel(b){return b.status==='reading'?'En cours':b.status==='finished'?'Terminé':'À découvrir';}
function bookPercent(b){const total=Math.max(0,Number(b.pagesTotal)||0),current=Math.max(0,Number(b.currentPage)||0);return b.status==='finished'?100:(total?Math.min(100,Math.round(current/total*100)):0);}
function updateBook(state,id,changes={}){
 const s=structuredClone(state),b=s.bookmarks.find(x=>x.id===id);if(!b)throw Error('Livre introuvable.');
 const total=Math.max(0,Math.floor(Number(changes.pagesTotal??b.pagesTotal)||0));
 let page=Math.max(0,Math.floor(Number(changes.currentPage??b.currentPage)||0));if(total)page=Math.min(page,total);
 const desired=changes.status||b.status;
 b.pagesTotal=total;
 b.status=desired==='finished'||(total&&page>=total)?'finished':desired==='to-read'?'to-read':page>0?'reading':desired;
 b.currentPage=b.status==='finished'&&total?total:page;
 return s;
}
function addBookEntry(state,id,{text='',analysis='',favorite=false,image=null}){
 const cleanText=text.trim().slice(0,5000),cleanAnalysis=analysis.trim().slice(0,5000);
 if(!cleanText&&!cleanAnalysis&&!image)throw Error('Écris une note, une réflexion ou ajoute une photo.');

function addCheckin(state,{missionId,feeling='en-route',difficulty='',nextAction='',scheduledFor=''}){
 const s=structuredClone(state);const mission=s.missions.find(m=>m.id===missionId);if(!mission)throw Error('Mission introuvable');
 const clean=nextAction.trim();if(!clean)throw Error('Choisis un prochain pas concret.');
 if(scheduledFor&&!/^\d{4}-\d{2}-\d{2}$/.test(scheduledFor))throw Error('Date invalide');
 s.checkins.unshift({id:uuid(),missionId,feeling:feeling.slice(0,40),difficulty:difficulty.trim().slice(0,700),nextAction:clean.slice(0,220),scheduledFor:scheduledFor||null,date:iso()});

function saveEssay(state,{title,category='réflexion',text,bookTitle='',status='draft'}){
 if(!title.trim()||!text.trim())throw Error('Titre et réflexion requis.');
 // Toute publication reste un brouillon privé : aucun contenu n'est propagé vers le site public.
 const s=structuredClone(state);s.essays.unshift({id:uuid(),title:title.trim().slice(0,160),category:category.slice(0,40),text:text.trim().slice(0,14000),bookTitle:bookTitle.trim().slice(0,180),status:'draft',date:iso()});

}
function missionAttention(state, now=new Date()){
 return state.missions.filter(m=>!m.completedAt).map(m=>{
 const history=[...(state.checkins||[]).filter(c=>c.missionId===m.id).map(x=>x.date),...m.steps.filter(x=>x.doneAt).map(x=>x.doneAt),m.createdAt];
 const last=history.sort().at(-1);const days=Math.max(0,Math.floor((now-new Date(last))/86400000));
 return {mission:m,daysWithoutTrace:days,needsAttention:days>=7,next:nextStep(m)};
 }).sort((a,b)=>b.daysWithoutTrace-a.daysWithoutTrace);
}

const K='atlas-v5-local-state'; // archive héritée, ne jamais écraser/supprimer
const GUEST_KEY='atlas-v19-guest-state';
const USER_KEY_PREFIX='atlas-v19-user-';
function accountStateKey(id){
 if(!/^[a-f0-9-]{36}$/i.test(String(id||'')))throw Error('Identifiant de compte invalide');
 return USER_KEY_PREFIX+id;
}
function readStateKey(key){try{return validState(JSON.parse(localStorage.getItem(key)||'null'))}catch{return blank()}}
function loadLocal(){return readStateKey(GUEST_KEY)}
function loadUserLocal(id){return readStateKey(accountStateKey(id))}
function saveLocal(s){try{const key=session?.id?accountStateKey(session.id):GUEST_KEY;localStorage.setItem(key,JSON.stringify(s));return true}catch{return false}}
function switchAtlasAccount(user){
 const previous=session?.id||null, next=user?.id||null;
 if(previous===next)return;
 session=user||null;
 if(cloudStore){cloudStore.user=user||null;cloudStore.rev=0;cloudStore.queue=Promise.resolve();}
 // Un compte ne peut jamais hériter automatiquement des données d'un autre compte
 // ou de la copie anonyme. La restauration du patrimoine historique est explicite.
 state=next?loadUserLocal(next):loadLocal();
 delete window.__atlas_remote_pending;
 closeModal();render();
}
function exportLegacyAtlas(){
 const raw=localStorage.getItem(K);
 if(!raw)throw Error('Aucune archive ATLAS historique trouvée sur cet appareil.');
 const old=JSON.parse(raw);
 if(![5,6].includes(old?.schema)||!Array.isArray(old.missions))throw Error('Ancienne archive non reconnue.');
 downloadJSON(old,'atlas-archive-historique-'+new Date().toISOString().slice(0,10)+'.json');
}

function downloadJSON(data,name='mon-atlas.json'){const file=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function importJSON(text){const data=JSON.parse(text);if(![5,6].includes(data?.schema)||!Array.isArray(data.missions))throw Error('Ce fichier n’est pas une sauvegarde ATLAS compatible.');return validState(data)}
async function resizePhoto(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Seules les photos JPG, PNG ou WebP sont acceptées.');if(file.size>8*1024*1024)throw Error('Photo trop lourde (8 Mo maximum).');const original=await createImageBitmap(file);const canvas=document.createElement('canvas'),scale=Math.min(1,950/original.width,950/original.height);canvas.width=Math.round(original.width*scale);canvas.height=Math.round(original.height*scale);canvas.getContext('2d').drawImage(original,0,0,canvas.width,canvas.height);original.close?.();const out=canvas.toDataURL('image/jpeg',.68);if(out.length>650000)throw Error('Photo trop volumineuse pour ce mode de démonstration.');return out;}
function connectSupabase(){const c=window.ATLAS_CONFIG||{};if(!c.supabaseUrl||!c.supabasePublishableKey||!window.supabase?.createClient)return null;return window.supabase.createClient(c.supabaseUrl,c.supabasePublishableKey,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});}
class AtlasCloud {
 constructor(client){this.client=client;this.user=null;this.rev=0;this.queue=Promise.resolve();this.lastError=null;}
 async session(){const {data,error}=await this.client.auth.getUser();if(error||!data?.user){this.user=null;return null}this.user=data.user;return data.user}
 async signIn(email,password){const {error}=await this.client.auth.signInWithPassword({email,password});if(error)throw error;return await this.session()}
 async signUp(email,password){const {data,error}=await this.client.auth.signUp({email,password});if(error)throw error;if(data?.session){this.user=data.user;return 'signed_in'}return 'check_email'}
 async signOut(){const {error}=await this.client.auth.signOut();if(error)throw error;this.user=null;this.rev=0}
 async load(){if(!this.user)throw Error('Connexion requise');const {data,error}=await this.client.from('atlas_v5_state').select('payload,revision').eq('user_id',this.user.id).maybeSingle();if(error)throw error;this.rev=data?.revision||0;return data?validState(data.payload):null}
 save(state){
  if(!this.user)return Promise.resolve();
  const owner=this.user.id, payload=JSON.parse(JSON.stringify(state));
  this.queue=this.queue.catch(()=>{}).then(async()=>{
    const {data:identity,error:identityError}=await this.client.auth.getUser();
    if(identityError||identity?.user?.id!==owner||this.user?.id!==owner)
      throw Error('Session modifiée : enregistrement cloud annulé.');
    const {data,error}=await this.client.rpc('atlas_v5_save',{new_payload:payload,expected_revision:this.rev});
    if(error)throw error;
    if(data===null||data===undefined)throw Error('Conflit de sauvegarde : un autre appareil a modifié ton Atlas. Exporte tes données et recharge avant de réessayer.');
    if(this.user?.id!==owner)throw Error('Session modifiée pendant la sauvegarde.');
    this.rev=data;this.lastError=null;
  }).catch(e=>{this.lastError=e;throw e});
  return this.queue;
 }
}

<section class="shelf"><div class="wrap columns"><div><div class="eyebrow">03 · Une vie qui s'écrit</div><h2>La bibliothèque des choses vécues.</h2><p>Des lectures, des apprentissages, des pensées et des pages de Carnet. Pour mieux comprendre ce que l'on vit, et ne pas tout oublier.</p>${link('public','Entrer dans les Carnets de l’Esprit →','btn cream')}</div><div class="shelf-books"><span>Philosophie</span><span>Apprendre</span><span>Les Missions</span><span>Mon Carnet</span></div></div></section>
<section class="invite"><div class="wrap"><div class="eyebrow">Ton chemin commence où tu es</div><h2>Et si tu commençais aujourd'hui ?</h2><p>Une direction, une Mission, un pas. Tu n'as pas besoin d'avoir toutes les réponses pour avancer.</p><button class="btn" data-action="begin">Commencer mon voyage →</button></div></section></main>`+footer();}
function startPage(){pageFrame('start',`<section class="wrap page-head"><div class="eyebrow">Le commencement · Page I</div><h1>Tout commence par un Cap.</h1><p class="lead">Pas un objectif à atteindre : une direction qui donne du sens à ce que tu décides de vivre.</p></section><section class="wrap" style="max-width:820px;padding:28px 0 100px"><div class="notebook"><div class="eyebrow">Mon carnet de route</div><form id="cap-form"><div class="form-row"><label for="cap">Dans quelle direction veux-tu construire ta vie ?</label><textarea id="cap" name="cap" required maxlength="500" placeholder="Ex. : Vivre librement, apprendre sans cesse et prendre le temps d'apprécier ce que je construis…">${h(state.cap)}</textarea></div><p class="muted text-sm">Tu pourras changer ce Cap quand tu changeras. Il restera dans ton histoire.</p><div class="actions"><button type="submit" class="btn">Tracer mon Atlas →</button></div></form><p class="notice">Ton premier Cap est gardé sur cet appareil. Pour le retrouver sur plusieurs appareils, une sauvegarde en compte Supabase devra être activée et sécurisée.</p></div></section>`);}
function leftFolio(){const active=state.missions.filter(m=>!m.completedAt).length,finished=state.missions.filter(m=>m.completedAt).length;return `<aside class="atlas-aside-left"><div class="folio"><div class="eyebrow">Mon Cap · Ma boussole</div><p class="cap-quote">“${h(state.cap||'Je choisis de commencer.')}”</p><div class="quote-rule"></div><button class="link" data-action="edit-cap">✎ Faire évoluer mon Cap</button></div><div class="folio atlas-summary"><div class="eyebrow">Mon chemin en chiffres</div><div class="atlas-counter"><strong>${active}</strong><span>Missions en chemin</span></div><div class="atlas-counter"><strong>${finished}</strong><span>Missions accomplies</span></div><a href="#/missions" class="link">Parcourir mes Missions</a><button class="link" data-action="souvenir" style="display:block;margin-top:14px">✧ Créer ma carte-souvenir</button></div></aside>`;}
function rightFolio(){const actions=state.actions.filter(a=>!a.archived&&a.horizon==='day');return `<aside class="atlas-aside-right"><div class="folio"><div class="eyebrow">Objectifs / to-do list</div><h3>Mes petits pas.</h3>${actions.filter(a=>!isActionDone(a)).slice(0,4).map(a=>`<label class="day-action"><input data-action-check="${attr(a.id)}" type="checkbox"><span>${h(a.title)}</span></label>`).join('')||'<p class="empty-caption">Aucune action en attente aujourd’hui.</p>'}${actions.some(a=>isActionDone(a))?`<p class="folio-done-counter">✦ ${actions.filter(a=>isActionDone(a)).length} fait${actions.filter(a=>isActionDone(a)).length>1?'s':''} aujourd’hui</p>`:''}<a href="#/aujourdhui" class="link">Voir mes objectifs →</a></div><div class="folio"><div class="eyebrow">Le Carnet</div><h3>Mes souvenirs.</h3><p class="muted text-sm">${state.notes.length} page${state.notes.length>1?'s':''} de vie conservée${state.notes.length>1?'s':''}.</p>${link('carnet','Ouvrir mon Carnet','link')}</div></aside>`;}
function mapScene(){return `<div class="map-scene" role="region" aria-label="Carte des quatre Territoires"><div class="map-top"><div class="eyebrow">✧ ATLAS · CARTE PERSONNELLE ✧</div><h2>La carte des possibles</h2><p>Quatre territoires. Tous tes chemins.</p></div><div class="map-medallion" aria-hidden="true">✦</div>${Object.entries(TERRITORIES).map(([id,t])=>{let count=state.missions.filter(m=>m.territory===id).length;return `<button data-action="territory" data-id="${id}" type="button" class="territory-pin ${id}"><span class="symbol">${t.symbol}</span><strong>${h(t.name)}</strong><small>${count?`${count} Mission${count>1?'s':''}`:'À explorer'}</small></button>`}).join('')}<div class="map-coordinates">43° N · AU RYTHME DE LA VIE</div></div>`;}
function actionHorizonPanel(id){const all=state.actions.filter(a=>!a.archived&&a.horizon===id);const pending=all.filter(a=>!isActionDone(a)),completed=all.filter(a=>isActionDone(a));return `<section class="todo-board" data-horizon="${id}"><div class="todo-board-head"><div><span class="eyebrow">${id==='day'?'Le présent':id==='week'?'Sept jours':id==='month'?'Un mois':'L’horizon'}</span><h3>${h(HORIZONS[id])}</h3></div><span class="todo-count">${completed.length}/${all.length}</span></div><div class="todo-rows">${pending.length?pending.map(a=>`<label class="todo-row"><input type="checkbox" data-action-check="${attr(a.id)}"><span>${h(a.title)}</span>${a.missionId?`<small>${h(state.missions.find(m=>m.id===a.missionId)?.title||'Mission')}</small>`:''}</label>`).join(''):'<p class="empty-caption">Rien en attente pour cette période.</p>'}</div><div class="todo-completed"><h4>✦ Fait ${id==='day'?"aujourd’hui":id==='week'?'cette semaine':id==='month'?'ce mois-ci':'à long terme'} · ${completed.length}</h4>${completed.map(a=>`<label class="todo-row completed"><input type="checkbox" data-action-check="${attr(a.id)}" checked><span>${h(a.title)}</span></label>`).join('')||'<p class="empty-caption">Les étapes accomplies apparaîtront ici.</p>'}</div><button class="link" data-action="new-action" data-horizon="${id}">+ Ajouter un objectif</button></section>`;}
function todayPage(){const focus=missionAttention(state);pageFrame('aujourdhui',`<div class="wrap app-main"><div class="section-heading"><div><span class="eyebrow">Mon quotidien</span><h1>Objectifs</h1><p class="lead">De petits engagements, reliés à tes grandes Missions.</p></div><button class="btn" data-action="new-action">+ Un objectif</button></div><div class="todo-horizons">${Object.keys(HORIZONS).map(actionHorizonPanel).join('')}</div><p class="todo-reset-note">Les objectifs récurrents redeviennent disponibles au début de leur prochaine période. Leur historique reste conservé dans ton Atlas et dans une sauvegarde exportable.</p><div class="section-heading mission-attention-head"><div><div class="eyebrow">Garder le cap</div><h2>Les Missions qui m’attendent.</h2></div></div><div class="attention-list">${focus.length?focus.map(({mission:m,daysWithoutTrace,needsAttention,next})=>{const latest=state.checkins.filter(c=>c.missionId===m.id).sort((a,b)=>b.date.localeCompare(a.date))[0];return `<article class="attention-item"><div><div class="eyebrow">${h(TERRITORIES[m.territory].name)} · ${needsAttention?'Un moment pour reprendre':'En chemin'}</div><h3>${h(m.title)}</h3><p>${next?'Prochain passage : '+h(next.title):'Crée une nouvelle Étape.'}</p>${latest?`<div class="next-intention">Prochain pas que j'ai choisi : <strong>${h(latest.nextAction)}</strong>${latest.scheduledFor?' · '+date(latest.scheduledFor):''}</div>`:''}<small>${needsAttention?`${daysWithoutTrace} jours sans nouvelle trace. Le chemin est toujours ouvert.`:'Tu peux avancer à ton rythme.'}</small></div><div class="attention-actions"><a class="btn outline" href="#/mission/${attr(m.id)}">Explorer</a><button class="btn" data-action="checkin" data-id="${attr(m.id)}">Faire le point</button></div></article>`}).join(''):`<div class="empty-engraving"><h3>Une nouvelle Mission ?</h3><button class="btn" data-action="new-mission">Tracer un chemin</button></div>`}</div></div>`); }
function atlasPage(){pageFrame('atlas',`<div class="wrap app-main"><div class="section-heading"><div><span class="eyebrow">✧ Le voyage intérieur</span><h1>Mon Atlas</h1><p class="muted">${h(state.cap||'Une direction. Autant de chemins que nécessaire.')}</p></div><button class="btn" data-action="new-mission">+ Une nouvelle Mission</button></div><div class="atlas-grid">${leftFolio()}${mapScene()}${rightFolio()}</div><div class="today-banner"><div><div class="eyebrow">Ton prochain geste</div><h3>Le moment d'agir est aujourd'hui.</h3><p>Consulte tes engagements et reprends une Mission, même après une pause.</p></div><div class="atlas-banner-actions"><button class="btn cream" data-action="souvenir">Garder une carte-souvenir</button><a href="#/aujourdhui" class="btn">Ouvrir mon quotidien →</a></div></div><div class="section-heading" style="margin-top:58px"><div><div class="eyebrow">Au fil du temps</div><h2>Les chemins ouverts.</h2></div>${link('missions','Toutes mes Missions ↗','link')}</div>${state.missions.length?`<div class="grid-cards">${state.missions.slice(0,4).map(m=>missionCard(m)).join('')}</div>`:emptyMission()}</div>`);}
function emptyMission(){return `<div class="empty-engraving"><div class="glyph">✧</div><h3>Le premier chapitre est encore à écrire.</h3><p>Une Mission peut être minuscule ou durer toute une vie. Elle t'appartient.</p><button class="btn" data-action="new-mission">Écrire ma première Mission →</button></div>`;}
function missionCard(m){const p=progress(m),t=TERRITORIES[m.territory];return `<a href="#/mission/${encodeURIComponent(m.id)}" class="mission-tile"><img src="${terrImage(m.territory)}" alt="" loading="lazy"><div class="inner"><span class="eyebrow">${h(t.name)} · ${m.mode==='guided'?'Chemin guidé':'Voie libre'}</span><h3>${h(m.title)}</h3><div class="mini-progress"><span style="width:${p.percent}%"></span></div><div class="meta">${p.done}/${p.total} Étape${p.total>1?'s':''} · ${p.finished?'Mission accomplie':'Chemin en cours ↗'}</div></div></a>`;}
function missionsPage(){const all=state.missions.filter(m=>filterTerritory==='all'||m.territory===filterTerritory);pageFrame('missions',`<div class="wrap app-main"><div class="section-heading"><div><div class="eyebrow">Mon itinéraire</div><h1>Mes Missions</h1><p class="muted">Chaque chemin commence par un premier geste.</p></div><button class="btn" data-action="new-mission">+ Nouvelle Mission</button></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin:28px 0">${[['all','Tous les chemins'],...Object.entries(TERRITORIES).map(([id,t])=>[id,t.name])].map(([id,name])=>`<button type="button" data-filter="${id}" class="btn slim ${id===filterTerritory?'':'transparent'}">${h(name)}</button>`).join('')}</div>${all.length?`<div class="grid-cards">${all.map(m=>missionCard(m)).join('')}</div>`:emptyMission()}</div>`);}
function missionPage(id){const m=state.missions.find(m=>m.id===id);if(!m){navigate('missions');return;}const t=TERRITORIES[m.territory],p=progress(m),n=m.steps.length,H=Math.max(510,n*172+125);let coords=m.steps.map((_,i)=>[i%2===0?215:485,122+i*172]);let path=coords.map(([x,y],i)=>i===0?`M ${x} ${y}`:`Q 350 ${y-87} ${x} ${y}`).join(' ');let doneCount=m.steps.findIndex(s=>!s.doneAt);if(doneCount<0)doneCount=n;const progressed=coords.slice(0,Math.max(1,doneCount));let passed=progressed.map(([x,y],i)=>i===0?`M ${x} ${y}`:`Q 350 ${y-87} ${x} ${y}`).join(' ');let cur=coords[Math.min(doneCount,Math.max(0,n-1))]||[350,100];pageFrame('mission',`<div class="wrap app-main"><a href="#/missions" class="link">← Mes Missions</a><div class="mission-hero"><div class="mission-hero-copy"><div class="eyebrow">${h(t.name)} · ${m.mode==='guided'?'Chemin guidé':'Voie libre'}</div><h1>${h(m.title)}</h1><p class="lead">${h(m.why||t.motto)}</p><div class="rule"></div><span class="pill">${p.done} passage${p.done>1?'s':''} sur ${p.total}</span> <span class="pill">${p.finished?'✦ Mission accomplie':'✧ Mon chemin est ouvert'}</span></div><div class="mission-hero-art"><img src="${terrImage(m.territory)}" alt="Illustration du Territoire ${h(t.name)}"></div></div><div class="section-heading"><div><div class="eyebrow">La carte de cette Mission</div><h2>À chaque pas, une trace.</h2></div><button class="btn outline" data-action="new-step" data-id="${attr(m.id)}">+ Une Étape</button></div>${n?`<div class="mission-map" style="height:${H}px"><div class="journey-start">Le commencement</div><svg class="journey-svg" viewBox="0 0 700 ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="basepath" d="${path}"/><path class="passed" d="${passed}"/></svg>${m.steps.map((st,i)=>{const [x,y]=coords[i],locked=!stepCanOpen(m,i)&&!st.doneAt;return `<button type="button" class="waypoint ${st.doneAt?'done':''} ${locked?'locked':''}" style="left:${x/700*100}%;top:${y}px" data-action="open-step" data-id="${attr(st.id)}" data-mission="${attr(m.id)}" ${locked?'disabled':''}><span class="seal">${st.doneAt?'✦':locked?'⌑':'✧'}</span><strong>${h(st.title)}</strong><small>${st.doneAt?'Scellé le '+date(st.doneAt):locked?'À découvrir':'À vivre · toucher pour avancer'}</small></button>`}).join('')}<div class="journey-end">${p.finished?'✧ Ce chemin a été vécu.':'La suite s’écrit en chemin.'}</div></div>`:emptyStep(m)}<div class="folio-footer">Le chemin compte autant que l'arrivée. ✧</div><div class="recovery"><div class="eyebrow" style="color:#e6c48b">Le courage de recommencer</div><h3>Un détour n'est pas une fin.</h3><p>Une Mission semble difficile ou s'est arrêtée ? Reviens au sens de ton Cap, choisis un petit pas réalisable et reprends ton chemin sans repartir de zéro.</p><button class="btn" data-action="recover" data-id="${attr(m.id)}">Retrouver mon chemin →</button></div>${missionRecords(m)}${p.finished?`<div class="chapter-finished"><div class="chapter-halo">✦</div><div class="eyebrow">Chapitre accompli · ${date(m.completedAt)}</div><h3>Cette Mission fait désormais partie de ton histoire.</h3><p>Tu peux célébrer le chemin parcouru, écrire ton bilan ou ouvrir une nouvelle grande Mission dans le Territoire ${h(t.name)}.</p><div class="actions"><button class="btn cream" data-action="celebrate-mission" data-id="${attr(m.id)}">✦ Revoir ma célébration</button><button class="btn outline" data-action="new-note" data-mission="${attr(m.id)}">Écrire mon bilan</button><button class="btn" data-action="new-mission-in-territory" data-id="${attr(m.territory)}">+ Une nouvelle Mission</button></div></div>`:''}</div>`);}
function missionRecords(m){const items=[...(state.checkins||[]).filter(c=>c.missionId===m.id).map(c=>({date:c.date,title:'Faire le point',detail:[c.difficulty?'Constat : '+c.difficulty:'', 'Prochain pas : '+c.nextAction, c.scheduledFor?'Prévu pour le '+date(c.scheduledFor):''].filter(Boolean)})),...(m.reflections||[]).filter(x=>x.type==='recovery').map(r=>({date:r.date,title:'Retrouver mon chemin',detail:['Frein : '+r.reason,'Reprise choisie : '+r.plan]}))].sort((a,b)=>b.date.localeCompare(a.date));return items.length?`<section class="mission-records"><div class="eyebrow">Ma mémoire de Mission</div><h3>Les bilans et les recommencements.</h3>${items.map(x=>`<article class="mission-record"><time>${date(x.date)}</time><h4>${h(x.title)}</h4>${x.detail.map(line=>`<p>${h(line)}</p>`).join('')}</article>`).join('')}</section>`:'';}
function emptyStep(m){return `<div class="empty-engraving"><div class="glyph">✦</div><h3>À toi de tracer les premiers passages.</h3><p>Quel serait le premier geste concret pour avancer ?</p><button class="btn" data-action="new-step" data-id="${attr(m.id)}">Ajouter ma première Étape</button></div>`}
function rhythmPage(){pageFrame('rythme',`<div class="wrap app-main"><div class="section-heading"><div><div class="eyebrow">Le rythme de ta vie</div><h1>Les petits pas.</h1><p class="muted">La discipline se construit avec des engagements réalisables, pas avec des journées parfaites.</p></div><button class="btn" data-action="new-action">+ Ajouter une action</button></div><div class="actions-layout">${Object.entries(HORIZONS).map(([id,title])=>`<section class="actions-panel"><div class="eyebrow">${id==='day'?'I':id==='week'?'II':id==='month'?'III':'IV'} · Mon rythme</div><h3>${title}</h3>${state.actions.filter(a=>a.horizon===id&&!a.archived).length?state.actions.filter(a=>a.horizon===id&&!a.archived).map(a=>`<label class="action-line ${isActionDone(a)?'done':''}"><input type="checkbox" data-action-check="${attr(a.id)}" ${isActionDone(a)?'checked':''}><span style="flex:1"><strong>${h(a.title)}</strong><small>${a.doneDates.length} période${a.doneDates.length>1?'s':''} accomplie${a.doneDates.length>1?'s':''}</small></span><button type="button" class="remove-btn" aria-label="Archiver l'action ${attr(a.title)}" data-action="archive-action" data-id="${attr(a.id)}">×</button></label>`).join(''):`<p class="empty-caption">Aucun engagement pour le moment.</p>`}<button class="link" data-action="new-action" data-horizon="${id}">+ Choisir un petit pas</button></section>`).join('')}</div><div class="recovery"><div class="eyebrow" style="color:#e7c49a">Sans série à perdre. Sans culpabilité.</div><h3>La constance, c'est aussi savoir revenir.</h3><p>Les actions quotidiennes ou hebdomadaires redeviennent disponibles à chaque nouvelle période. Tu conserves la mémoire de ce que tu as accompli, même après une interruption.</p>${link('missions','Revoir mes Missions →','btn cream')}</div></div>`);}
function journalPage(){pageFrame('carnet',`<div class="wrap app-main"><div class="journal"><aside><div class="eyebrow">Archive personnelle</div><h2>Mon Carnet de vie.</h2><p class="lead">Pour ne pas oublier le chemin.</p><p class="muted">Des notes, des doutes, des photos, des réussites. Tout ce qui mérite d'être conservé.</p><button class="btn" data-action="new-note">+ Écrire une page</button><div class="rule"></div><div class="eyebrow">La chronologie</div><p class="muted text-sm">${state.history.length} trace${state.history.length>1?'s':''} du voyage conservée${state.history.length>1?'s':''}.</p></aside><div class="notebook">${state.notes.length?[...state.notes].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(n=>`<button class="journal-note-button" type="button" data-action="open-note" data-id="${attr(n.id)}"><article class="note"><div class="date">${date(n.date)} · ${h(n.emotion)}</div><p>${h((n.text||'').slice(0,260))}${(n.text||'').length>260?'…':''}</p>${n.image&&n.image.startsWith('data:image/')?`<img src="${n.image}" alt="Photographie personnelle du souvenir">`:''}<div class="note-meta">${n.missionId?`Relié à la Mission ${h(state.missions.find(m=>m.id===n.missionId)?.title||'archivée')}`:'Une page de mon histoire'} · <strong>Cliquer pour l’ouvrir</strong></div></article></button>`).join(''):`<div class="eyebrow">Page I · le début</div><h3 style="margin:25px 0">Toutes les grandes histoires commencent quelque part.</h3><p class="empty-caption">Tu peux commencer en écrivant simplement ce que tu as ressenti aujourd'hui.</p><button class="link" data-action="new-note">Ouvrir une nouvelle page →</button>`}${state.history.length?`<div class="rule"></div><div class="eyebrow">Les événements de mon Atlas</div>${state.history.slice(0,15).map(e=>`<div class="note" style="padding:10px 0"><div class="date">${date(e.date)}</div><p style="font-size:1.15rem">${h(e.description)}</p></div>`).join('')}`:''}</div></div></div>`);}
function libraryPage(){pageFrame('bibliotheque',`<div class="wrap app-main"><div class="section-heading"><div><div class="eyebrow">Esprit · L'éducation d'une vie</div><h1>Ma Bibliothèque.</h1><p class="muted">Ce que je lis, ce que je découvre, ce que je veux comprendre.</p></div></div><section class="folio" style="margin:22px 0"><div class="eyebrow">Mes Carnets de l'Esprit · Brouillons privés</div><h2>La pensée en mouvement.</h2><p>Rassembler ce que j'apprends, les doutes, les questions et les idées qui me traversent.</p><button class="btn outline" data-action="essay-draft">+ Écrire une réflexion</button>${(state.essays||[]).length?`<div class="essay-drafts">${state.essays.map(e=>`<article class="public-essay" style="cursor:pointer" data-action="open-essay" data-id="${attr(e.id)}"><small>${h(e.category)} · ${date(e.date)} · Privé</small><h3>${h(e.title)}</h3><p>${h(e.text.slice(0,280))}${e.text.length>280?'…':''}</p><span class="link" style="pointer-events:none">Ouvrir ici</span></article>`).join('')}</div>`:''}</section><div class="reading-grid"><div><div class="eyebrow">Mon rayon personnel</div><h3 style="margin:12px 0 20px">Les livres qui m'accompagnent.</h3>${state.bookmarks.length?`<div class="library-list">${state.bookmarks.map(b=>`<button type="button" class="book-row" data-action="open-book" data-id="${attr(b.id)}"><div style="display:flex;gap:14px;align-items:center">${b.cover&&/^data:image\//.test(b.cover)?`<img class="book-cover" alt="Couverture de ${attr(b.title)}" src="${b.cover}">`:'<div class="book-glyph">✧</div>'}<div><strong>${h(b.title)}</strong><div class="muted text-sm">${h(b.author)}</div><div class="muted text-sm">${bookLabel(b)} · ${b.pagesTotal?`${b.currentPage||0}/${b.pagesTotal} pages`:'Progression libre'}</div></div></div><span class="pill">${bookPercent(b)}%</span></button>`).join('')}</div><div class="library-footer-actions"><button class="btn" data-action="new-book">+ Ajouter un livre</button></div>`:`<div class="empty-engraving"><div class="glyph">✦</div><h3>Une bibliothèque qui grandira avec moi.</h3><p>Commence par un livre que tu souhaites lire, sans pression de quantité.</p><button class="btn" data-action="new-book">Ajouter mon premier livre</button></div>`}</div><aside class="reading-public"><div class="eyebrow" style="color:#e1bb83">Les Carnets de l'Esprit</div><h3>Apprendre et transmettre.</h3><p>Dans mon Atlas public, je partagerai les lectures, les notions et les questions qui accompagnent ma Mission « Construire l’éducation que je n’ai pas eue ».</p><p>La lecture commune arrivera sous une forme simple : je pourrai ajouter un livre à ma bibliothèque, garder mes notes, mes passages favoris et mon propre avis. Les échanges communautaires viendront ensuite, quand la modération sera prête.</p>${link('public','Découvrir l’Atlas de Cloe →','btn cream')}</aside></div></div>`);}
// Fallback à l'amorçage : la page publique effective est rendue par v12.js / showPublic().

// ATLAS V8 · scénographie de l'encre, du chemin, de la lumière et des souvenirs.
// Le mouvement accompagne le contenu, n'influence ni les données ni le stockage.
let previousMotionRoute=null, motionObserver=null, recentActionId=null;
const reduceMotion=window.matchMedia?.('(prefers-reduced-motion: reduce)');
const motionDisabled=()=>Boolean(reduceMotion?.matches);
function animateArrows(main){
  const controls=main.querySelectorAll('.btn,.link,.story-portrait a,.hero-enter-hit');
  for(const el of controls){
    if(el.querySelector('.atlas-moving-arrow'))continue;
    const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
    let node;
    while((node=walker.nextNode())){
      const text=node.textContent||'';
      const match=text.match(/([→↗])\s*$/);
      if(!match)continue;
      const start=text.lastIndexOf(match[1]);
      const before=document.createTextNode(text.slice(0,start));
      const span=document.createElement('span');span.className='atlas-moving-arrow';span.setAttribute('aria-hidden','true');span.textContent=match[1];
      const after=document.createTextNode(text.slice(start+1));
      node.replaceWith(before,span,after);
      break;
    }
  }
}
function prepareMotion(current){
  motionObserver?.disconnect();motionObserver=null;
  const main=root.querySelector('#main');if(!main)return;
  const routeChanged=previousMotionRoute!==current;previousMotionRoute=current;
  // Browser-level identity prevents every click from endlessly replaying an intro.
  main.dataset.atlasChapter=current||'accueil';
  animateArrows(main);
  const passed=main.querySelector('.journey-svg .passed');
  if(passed){
    try{const length=Math.ceil(passed.getTotalLength());
      if(length>1){passed.style.setProperty('--v8-route-length',String(length));passed.style.strokeDasharray=`${length} ${length}`;}}
    catch(e){console.warn('Tracé SVG indisponible',e);}
  }
  main.querySelectorAll('.waypoint').forEach((el,i)=>el.style.setProperty('--v8-order',String(Math.min(i,8))));
  main.querySelectorAll('.territory-chapter a,.map-scene .territory-pin').forEach((el,i)=>el.style.setProperty('--v8-order',String(i%4)));
  main.querySelectorAll('.shelf-books span').forEach((el,i)=>el.style.setProperty('--v8-order',String(i)));
  main.querySelectorAll('.book-row,.mission-tile,.mission-record,.note,.public-essay').forEach((el,i)=>el.style.setProperty('--v8-order',String(i%7)));
  if(recentActionId){
    const input=[...main.querySelectorAll('[data-action-check]')].find(el=>el.dataset.actionCheck===recentActionId);
    const row=input?.closest('.todo-row,.action-line');
    if(row){row.classList.add('atlas-just-completed');const halo=document.createElement('span');halo.className='atlas-task-flare';halo.setAttribute('aria-hidden','true');halo.textContent='✧';row.append(halo);}
    recentActionId=null;
  }
  if(motionDisabled())return;
  // Specific stage directions: text, brush illustrations, compass, papers, chapters, maps.
  const sceneSelectors=[
    '.hero','.manifesto','.territory-public','.territory-chapter','.chapter-title',
    '.founder-story','.story-portrait','.shelf','.shelf-books','.invite',
    '.page-head','.section-heading','.map-scene','.mission-map','.mission-hero',
    '.mission-hero-art','.folio','.todo-board','.todo-completed','.mission-records',
    '.mission-tile','.attention-item','.notebook','.journal','.note','.book-row',
    '.reading-public','.public-essay','.recovery','.chapter-finished','.workshop-layout'
  ];
  const candidates=[...new Set([...main.querySelectorAll(sceneSelectors.join(','))])];
  if(!('IntersectionObserver' in window)){
    for(const el of candidates)el.classList.add('v8-inview');return;
  }
  motionObserver=new IntersectionObserver(entries=>{
    for(const {target,isIntersecting} of entries){if(!isIntersecting)continue;
      target.classList.add('v8-inview');motionObserver.unobserve(target);
    }
  },{rootMargin:'0px 0px -16px 0px',threshold:.08});
  for(const el of candidates)motionObserver.observe(el);
  // Start screen and navigations have distinct page reveals; never use generic left slide.
  if(routeChanged)main.classList.add('v8-chapter-enter');
}
function animateCelebration(){
  if(motionDisabled())return;
  const field=dialogs.querySelector('.atlas-sparks');if(!field)return;
  for(let i=0;i<18;i++){
    const star=document.createElement('i');
    star.style.setProperty('--v8-angle',`${i*20}deg`);
    star.style.setProperty('--v8-radius',`${84+(i%4)*18}px`);
    star.style.setProperty('--v8-delay',`${120+(i%6)*75}ms`);
    star.textContent=i%3===0?'✧':'✦';field.append(star);
  }
}

function downloadSouvenirPNG(){
 const canvas=souvenirCanvas();if(!canvas)return notify('Ouvre d’abord ta carte-souvenir.');
 try{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=`mon-atlas-souvenir-${new Date().toISOString().slice(0,10)}.png`;document.body.append(a);a.click();a.remove();notify('Ta carte-souvenir en image PNG est prête.');}catch(e){notify('Téléchargement indisponible dans ce navigateur.');}
}

async function shareSouvenirPNG(){
 const canvas=souvenirCanvas();if(!canvas)return notify('Ouvre d’abord ta carte-souvenir.');
 try{
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob)throw Error('Image indisponible');
  const file=new File([blob],`mon-atlas-souvenir-${new Date().toISOString().slice(0,10)}.png`,{type:'image/png'});
  if(navigator.share&&navigator.canShare?.({files:[file]})){
   try{await navigator.share({files:[file],title:'Ma carte-souvenir ATLAS',text:'Une trace de mon voyage ATLAS.'});}
   catch(error){if(error?.name!=='AbortError')notify('Partage annulé ou indisponible. Tu peux télécharger l’image.');}
  }else{downloadSouvenirPNG();notify('Ta carte a été téléchargée. Joins le fichier PNG à ton e-mail pour le partager.');}
 }catch(error){notify('Le partage direct n’est pas disponible ici. Télécharge ta carte en PNG.');}
}

function newMission(){modal('Ouvrir un nouveau chemin.','L’atelier des Missions',`<p>Une Mission, c'est une intention qui devient un chemin praticable dans la vie réelle.</p><form id="mission-form"><div class="form-row"><label>Nom de la Mission</label><input name="title" required maxlength="100" placeholder="Ex. : Apprendre à cuisiner dix recettes"></div><div class="form-row"><label>Dans quel Territoire ?</label><select name="territory">${Object.entries(TERRITORIES).map(([id,t])=>`<option value="${id}" ${filterTerritory===id?'selected':''}>${h(t.name)} — ${h(t.motto)}</option>`).join('')}</select></div><div class="form-row"><label>Pourquoi cette Mission compte pour moi (facultatif)</label><textarea name="why" maxlength="800" placeholder="Je veux devenir capable de…" style="min-height:75px"></textarea></div><div class="form-row"><label>Comment avancer ?</label><select name="mode"><option value="guided">Chemin guidé — les étapes s'ouvrent dans l'ordre</option><option value="free">Voie libre — je choisis mon propre ordre</option></select></div><div class="form-row"><label>Mes trois premiers passages (un par ligne, modifiables ensuite)</label><textarea name="steps" placeholder="Chercher ce dont j'ai besoin\nEssayer une première fois\nNoter ce que j'ai appris"></textarea><span class="hint">Tu peux commencer avec une seule Étape ou en ajouter plus tard.</span></div><div class="actions"><button class="btn" type="submit">Tracer cette Mission →</button></div></form>`,true);}
function newStep(id){const m=state.missions.find(x=>x.id===id);if(!m)return;modal('Créer un passage.','Mission · '+m.title,`<p>Le prochain pas doit être assez clair pour savoir quand il est accompli.</p><form id="step-form" data-mission="${attr(id)}"><div class="form-row"><label>Que vais-je faire concrètement ?</label><input name="title" maxlength="160" required placeholder="Ex. : M'entraîner dix minutes demain matin"></div><button class="btn" type="submit">Ajouter cette Étape →</button></form>`);}
function openStep(mid,id){const m=state.missions.find(x=>x.id===mid);const st=m?.steps.find(x=>x.id===id);if(!m||!st)return;const done=Boolean(st.doneAt);modal(done?'Un passage déjà vécu.':'Le prochain passage.','Mission · '+m.title,`<div class="eyebrow">${done?'Sceau apposé · '+date(st.doneAt):'À vivre dans le monde réel'}</div><h3 style="font-size:2.4rem;margin:10px 0 20px">${h(st.title)}</h3><p>${done?'Tu peux corriger cette étape si tu l’as cochée par erreur. En chemin guidé, les validations suivantes seront également rouvertes.':'Une fois cette Étape réellement accomplie, reviens ici pour en garder la trace.'}</p><div class="actions">${done?`<button class="btn outline" data-action="undo-step" data-mission="${attr(mid)}" data-id="${attr(id)}">Réouvrir cette Étape</button>`:`<button class="btn" data-action="complete-step" data-mission="${attr(mid)}" data-id="${attr(id)}">✧ Apposer mon sceau</button>`}</div>`);}
function completionModal(mid){const m=state.missions.find(x=>x.id===mid),p=m&&progress(m);if(!m)return;const end=p?.finished;modal(end?'Une Mission accomplie.':'Un passage franchi.',end?'✦ Le sceau de la Mission':'✧ Un pas dans le monde réel',`<div class="celebration ${end?'celebration-final':'celebration-step'}" aria-live="polite"><div class="celebration-rays" aria-hidden="true">✧</div><div class="atlas-sparks" aria-hidden="true"></div><div class="celebration-seal" aria-hidden="true">${end?'✦':'✧'}</div><div class="eyebrow">${end?'Mission achevée · '+h(TERRITORIES[m.territory].name):'Une étape réelle, une trace durable'}</div><h3>${end?'Tu as vécu ce chemin.':'Ce pas compte.'}</h3><p>${end?'Toutes tes étapes sont désormais scellées. Ton histoire continue : choisis la prochaine Mission, ou prends le temps de garder un souvenir.':'La carte s’enrichit de ce que tu as réellement accompli. Chaque geste est une partie de ton voyage.'}</p><div class="actions">${end?`<button class="btn" data-action="new-mission-in-territory" data-id="${attr(m.territory)}">Continuer dans ${h(TERRITORIES[m.territory].name)} →</button>`:''}<button class="btn outline" data-action="new-note" data-mission="${attr(mid)}">Écrire mon souvenir</button><button class="btn transparent" data-action="close">Retour à ma carte</button></div></div>`); }
function newAction(horizon='day'){modal('Choisir un petit pas.','Mon rythme',`<form id="action-form"><div class="form-row"><label>Mon engagement concret</label><input name="title" required maxlength="160" placeholder="Ex. : Lire dix pages après le dîner"></div><div class="form-row"><label>À quel rythme ?</label><select name="horizon">${Object.entries(HORIZONS).map(([id,label])=>`<option value="${id}" ${id===horizon?'selected':''}>${label}</option>`).join('')}</select><span class="hint">Une action quotidienne se renouvelle chaque jour, sans sanction ni remise à zéro du parcours.</span></div><div class="form-row"><label>Reliée à une Mission (facultatif)</label><select name="missionId"><option value="">Aucune Mission particulière</option>${state.missions.map(m=>`<option value="${attr(m.id)}">${h(m.title)}</option>`).join('')}</select></div><button class="btn" type="submit">Ajouter à mon rythme →</button></form>`);}
function newNote(mid=''){modal('Une page de ta vie.','Carnet personnel',`<p>Les petits souvenirs ont aussi leur place. Rien de ce que tu écris ici n'est publié automatiquement.</p><form id="note-form"><div class="form-row"><label>Ce dont je veux me souvenir</label><textarea name="text" maxlength="8000" placeholder="Aujourd'hui, j'ai essayé… J'ai ressenti…"></textarea></div><div class="form-row"><label>Ce que je ressens</label><select name="emotion">${['Fierté','Joie','Curiosité','Gratitude','Doute','Difficulté','Apaisement','Espoir'].map(e=>`<option value="${e}">${e}</option>`).join('')}</select></div><div class="form-row"><label>Ma Mission (facultatif)</label><select name="missionId"><option value="">Souvenir libre</option>${state.missions.map(m=>`<option value="${attr(m.id)}" ${m.id===mid?'selected':''}>${h(m.title)}</option>`).join('')}</select></div><div class="form-row"><label>Une photographie (facultatif)</label><input id="note-photo" type="file" accept="image/jpeg,image/png,image/webp"><span class="hint">Photo privée sur cet appareil. Pour le cloud, les photos devront être transférées vers un stockage privé dédié.</span></div><button class="btn" type="submit">Conserver ce souvenir →</button></form>`,true);}
function newBook(){bookCoverPending=null;modal('Un livre à découvrir.','Bibliothèque personnelle',`<form id="book-form"><div class="form-row"><label for="book-title">Titre</label><input id="book-title" name="title" required maxlength="180"></div><div class="form-row"><label for="book-author">Auteur ou autrice</label><input id="book-author" name="author" required maxlength="100"></div><div class="form-row"><label for="book-photo">La couverture du livre (facultative)</label><input id="book-photo" type="file" accept="image/jpeg,image/png,image/webp"><span class="hint" id="book-cover-notice">Ajoute une photographie ou la véritable couverture de ton exemplaire. La photo est enregistrée localement.</span></div><div class="form-row"><label>Nombre total de pages</label><input name="pagesTotal" type="number" min="0" placeholder="Ex. : 320"></div><div class="form-row"><label>J’en suis à la page</label><input name="currentPage" type="number" min="0" placeholder="Ex. : 0"></div><div class="form-row"><label>Mon état de lecture</label><select name="status"><option value="to-read">À découvrir</option><option value="reading">Lecture en cours</option><option value="finished">Terminé</option></select></div><button class="btn" type="submit">Ajouter à ma bibliothèque →</button></form>`);}
function checkin(id){const m=state.missions.find(x=>x.id===id);if(!m)return;modal('Garder le cap.','Un bilan sans jugement',`<p>Quelques questions pour comprendre ton chemin, même lorsque tu as ralenti.</p><form id="checkin-form" data-mission="${attr(id)}"><div class="form-row"><label>Comment avances-tu en ce moment ?</label><select name="feeling"><option value="en-route">J'avance</option><option value="difficile">C'est difficile</option><option value="pause">J'ai fait une pause</option><option value="nouveau-départ">Je reprends</option></select></div><div class="form-row"><label>Qu'est-ce qui t'a aidé ou freiné ? (facultatif)</label><textarea name="difficulty" maxlength="700"></textarea></div><div class="form-row"><label>Mon prochain pas, concret et réaliste</label><input name="nextAction" required maxlength="220" placeholder="Ex. : pratiquer 15 minutes mardi"></div><div class="form-row"><label>Quand aimerais-tu le faire ? (facultatif)</label><input type="date" name="scheduledFor"></div><button class="btn" type="submit">Conserver mon engagement</button></form>`);}
function essayDraft(){modal('Écrire pour comprendre.','Carnets de l’Esprit · Privé',`<p>Ces réflexions restent privées. La publication vers ton Atlas public exige un futur atelier d'administration vérifié.</p><form id="essay-draft-form"><div class="form-row"><label>Titre</label><input name="title" required maxlength="160" placeholder="Ce que j'ai compris aujourd'hui"></div><div class="form-row"><label>Nature du texte</label><select name="category"><option value="réflexion">Une réflexion</option><option value="notion">Une notion apprise</option><option value="mini-essai">Un mini-essai</option><option value="lecture">Un carnet de lecture</option></select></div><div class="form-row"><label>Livre lié (facultatif)</label><input name="bookTitle" maxlength="180"></div><div class="form-row"><label>Mes mots</label><textarea name="text" required maxlength="14000" rows="8"></textarea></div><button class="btn" type="submit">Sauvegarder ce brouillon privé</button></form>`,true);}
function recovery(id){const m=state.missions.find(x=>x.id===id);if(!m)return;modal('Retrouver mon chemin.','La force de reprendre',`<p>Tu n'as pas besoin de recommencer à zéro. Cherchons un prochain pas plus facile à tenir.</p><form id="recover-form" data-mission="${attr(id)}"><div class="form-row"><label>Qu'est-ce qui a freiné cette Mission ?</label><select name="reason"><option>Le manque de temps</option><option>La difficulté de la prochaine étape</option><option>La fatigue ou la motivation</option><option>Un changement de priorités</option><option>Une raison personnelle</option></select></div><div class="form-row"><label>Quel petit pas réaliste puis-je choisir ?</label><textarea required name="plan" placeholder="Ex. : Prévoir seulement dix minutes samedi après le déjeuner"></textarea></div><p class="notice">Ton parcours et les dates des étapes passées resteront intacts.</p><button class="btn" type="submit">Reprendre mon chemin →</button></form>`);}
function settings(){modal('Mes souvenirs et mon compte.','Conserver mon Atlas',`<p>Ma vie ne tient pas dans un fichier incompréhensible. Je peux créer une belle image de mon chemin, à conserver, imprimer ou envoyer.</p><div class="actions" style="justify-content:flex-start"><button class="btn" data-action="souvenir">✧ Créer une carte-souvenir (image PNG)</button></div><div class="rule"></div><p class="muted text-sm">Pour retrouver toutes mes notes, mes livres et mes étapes après un changement d'appareil, la sauvegarde complète reste disponible ci-dessous. Elle sert à restaurer les données, et n'est pas conçue pour être lue.</p><details class="settings-backup"><summary>Sauvegarde complète et restauration</summary><div class="notice">${session?'Compte connecté. La sauvegarde en ligne dépend de la configuration et du bon fonctionnement de Supabase.':cloud?'Sauvegarde locale active. Connecte-toi pour synchroniser après configuration.':'Cet aperçu enregistre sur cet appareil uniquement. Il ne constitue pas encore une sauvegarde sûre sur plusieurs décennies.'}</div><div class="actions"><button class="btn outline" data-action="export">Télécharger ma sauvegarde privée</button><button class="btn outline" data-action="import">Restaurer une sauvegarde</button>${localStorage.getItem(K)?'<button class="btn outline" data-action="export-legacy">Télécharger mon ancienne archive ATLAS</button>':''}${cloud?`<button class="btn outline" data-action="auth">${session?'Mon compte':'Créer mon compte / me connecter'}</button>`:''}</div><input type="file" id="import-file" accept=".json,application/json" hidden>${session?'<button class="link" data-action="signout">Se déconnecter</button>':''}</details><p class="muted text-sm" style="margin-top:20px">Un envoi automatique de cartes par e-mail demandera une adresse de contact et un service d’envoi. Aucune donnée personnelle ne part par e-mail automatiquement.</p>`,true);}
function auth(){if(!cloud)return notify('La sauvegarde cloud n’est pas encore activée.');modal('Sauvegarder mon voyage.','Compte personnel sécurisé',`<p>Tu as déjà commencé ton Cap. Crée un compte pour pouvoir le retrouver sur tes appareils, une fois la base configurée.</p><form id="auth-form"><div class="form-row"><label>Adresse e-mail</label><input required name="email" type="email" autocomplete="email"></div><div class="form-row"><label>Mot de passe</label><input required name="password" type="password" autocomplete="current-password" minlength="10"></div><div class="form-row"><label>Je souhaite</label><select name="intent"><option value="signup">Créer mon compte</option><option value="signin">Me connecter</option></select></div><button class="btn" type="submit">Continuer →</button></form><p class="muted text-sm">L'inscription peut nécessiter la confirmation de ton e-mail. Tes données restent locales tant que la connexion n'est pas confirmée.</p>`);}
function reconcileCloud(remote){if(!remote){return cloudStore.save(state).then(()=>notify('Ton Atlas local a été enregistré en ligne.'));}if(!state.cap&&!state.missions.length&&!state.notes.length&&!state.actions.length){state=remote;saveLocal(state);render();return Promise.resolve(notify('Ton Atlas en ligne a été chargé.'));}modal('Deux versions de ton Atlas.','Attention aux souvenirs',`<p>Des données existent sur cet appareil <strong>et</strong> dans ton compte. Pour ne rien perdre, choisis la version à conserver. Tu peux exporter la version locale avant de choisir.</p><div class="actions"><button class="btn outline" data-action="export">Exporter le local</button><button class="btn" data-action="keep-cloud">Charger mon Atlas en ligne</button><button class="btn transparent" data-action="keep-local">Remplacer le cloud par cet Atlas local</button></div>`);window.__atlas_remote_pending=remote;return Promise.resolve();}
async function afterAuth(){
 if(!cloudStore)return;
 const u=await cloudStore.session();
 switchAtlasAccount(u);
 if(!u)return;
 const remote=await cloudStore.load();
 if(session?.id!==u.id)return;
 await reconcileCloud(remote);render();
}

root.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(b){filterTerritory=b.dataset.filter;render();return;}const terr=e.target.closest('[data-territory]');if(terr){filterTerritory=terr.dataset.territory;return;}const a=e.target.closest('[data-action]');if(!a)return;const type=a.dataset.action,id=a.dataset.id,mid=a.dataset.mission;e.preventDefault();try{
 if(type==='begin')navigate(state.cap?'atlas':'start');else if(type==='settings')settings();else if(type==='souvenir')souvenirPreview();else if(type==='edit-cap')editCap();else if(type==='new-mission')newMission();else if(type==='new-mission-in-territory'){filterTerritory=id;closeModal();newMission();}else if(type==='celebrate-mission')completionModal(id);else if(type==='new-step')newStep(id);else if(type==='territory'){filterTerritory=id;navigate('missions');}else if(type==='open-step')openStep(mid,id);else if(type==='new-action')newAction(a.dataset.horizon||'day');else if(type==='new-note')newNote(mid||'');else if(type==='open-note')openNote(id);else if(type==='new-book')newBook();else if(type==='open-book')openBook(id);else if(type==='open-essay')navigate('essai/'+id);else if(type==='recover')recovery(id);else if(type==='checkin')checkin(id);else if(type==='essay-draft')essayDraft();else if(type==='archive-action'){persist(archiveAction(state,id));notify('Action archivée.');}
 }catch(err){notify(err.message);}});
root.addEventListener('change',e=>{const el=e.target.closest('[data-action-check]');if(!el)return;const a=state.actions.find(x=>x.id===el.dataset.actionCheck);if(!a)return;const done=isActionDone(a);el.checked=done;modal(done?'Modifier une validation ?':'Valider un objectif ?','Objectifs',`<div class="confirm-action"><div class="eyebrow">${h(HORIZONS[a.horizon])}</div><h3>${h(a.title)}</h3><p>${done?'Tu peux retirer cette validation si tu l’as cochée par erreur. La trace passée reste dans ton historique général.':'As-tu réellement accompli cet objectif ? Il sera rangé dans « Fait aujourd’hui » ou dans la période correspondante, et son prochain cycle restera disponible.'}</p><div class="actions"><button class="btn" data-action="confirm-action" data-id="${attr(a.id)}">${done?'Oui, retirer la validation':'Oui, c’est accompli ✦'}</button><button class="btn outline" data-action="close">Annuler</button></div></div>`);});
root.addEventListener('submit',e=>{const form=e.target;e.preventDefault();if(form.id==='cap-form'){try{persist(updateCap(state,form.elements.cap.value));navigate('atlas');if(cloud&&!session)notify('Ton Cap est créé. Pense à le sauvegarder dans ton compte.');else notify('Bienvenue dans ton Atlas.');}catch(err){notify(err.message);}return;}if(form.id==='atelier-form'){try{localStorage.setItem('atlas-editor-title',form.elements.title.value);localStorage.setItem('atlas-editor-body',form.elements.body.value);notify('Brouillon conservé localement, non publié.');render();}catch(err){notify('Sauvegarde du brouillon impossible.');}}});
dialogs.addEventListener('click',async e=>{if(e.target.id==='overlay'){closeModal();return;}const a=e.target.closest('[data-action]');if(!a)return;e.preventDefault();const type=a.dataset.action,mid=a.dataset.mission,id=a.dataset.id;try{if(type==='close'){closeModal();return;}if(type==='souvenir'){souvenirPreview();return;}if(type==='download-souvenir'){downloadSouvenirPNG();return;}if(type==='share-souvenir'){await shareSouvenirPNG();return;}if(type==='confirm-action'){const changed=toggleAction(state,id);recentActionId=id;closeModal();persist(changed);notify('Objectif mis à jour.');return;}if(type==='new-mission-in-territory'){filterTerritory=id;closeModal();newMission();return;} if(type==='complete-step'){const updated=setStep(state,mid,id,true);closeModal();persist(updated);completionModal(mid);}else if(type==='undo-step'){closeModal();persist(setStep(state,mid,id,false));notify('Le passage est à nouveau ouvert.');}else if(type==='new-note')newNote(mid||'');else if(type==='export'){downloadJSON(state,`mon-atlas-${new Date().toISOString().slice(0,10)}.json`);notify('Export créé.');}else if(type==='import')dialogs.querySelector('#import-file')?.click();else if(type==='export-legacy'){exportLegacyAtlas();notify('Archive historique exportée. Elle reste sur cet appareil.');}else if(type==='auth')auth();else if(type==='signout'){await cloudStore.signOut();session=null;closeModal();notify('Déconnecté. La session est fermée ; les copies locales sont conservées pour sauvegarde.');}else if(type==='keep-cloud'){if(!confirm('Charger la version en ligne remplacera les données locales non exportées. Continuer ?'))return;state=window.__atlas_remote_pending;saveLocal(state);delete window.__atlas_remote_pending;closeModal();render();notify('Version en ligne chargée.');}else if(type==='keep-local'){if(!confirm('Remplacer les données de ton compte en ligne par celles de cet appareil ?'))return;await cloudStore.save(state);delete window.__atlas_remote_pending;closeModal();notify('Atlas local envoyé dans ton compte.');}}catch(err){notify(err.message);}});
dialogs.addEventListener('change',async e=>{const el=e.target;if(el.id==='book-photo'){if(!el.files?.[0])return;try{bookCoverPending=await resizePhoto(el.files[0]);const note=dialogs.querySelector('#book-cover-notice');if(note)note.textContent='✓ Couverture enregistrée, prête à être ajoutée.';}catch(err){bookCoverPending=null;notify(err.message);}return;}if(el.id==='book-note-photo'){if(!el.files?.[0])return;try{bookCoverPending=await resizePhoto(el.files[0]);const note=dialogs.querySelector('#book-note-notice');if(note)note.textContent='✓ Photo préparée pour ce dossier de lecture.';}catch(err){bookCoverPending=null;notify(err.message);}return;}if(el.id==='note-photo'){if(!el.files?.[0])return;try{photoPending=await resizePhoto(el.files[0]);notify('Photographie préparée.');}catch(err){photoPending=null,bookCoverPending=null;notify(err.message);}}if(el.id==='import-file'){const f=el.files?.[0];if(!f)return;try{const data=importJSON(await f.text());if(!confirm('Importer remplacera ton Atlas actuel sur cet appareil. As-tu exporté ta sauvegarde ?'))return;closeModal();persist(data);notify('Sauvegarde importée.');navigate('atlas');}catch(err){notify(err.message);}}});
dialogs.addEventListener('submit',async e=>{e.preventDefault();const form=e.target,fd=new FormData(form),val=(x)=>String(fd.get(x)||'');try{if(form.id==='edit-cap-form'){const s=updateCap(state,val('cap'));closeModal();persist(s);notify('Ta boussole a évolué.');}else if(form.id==='mission-form'){let {state:s,mission}=createMission(state,{title:val('title'),territory:val('territory'),mode:val('mode'),why:val('why'),steps:val('steps').split(/\n+/)});closeModal();persist(s);navigate(`mission/${mission.id}`);notify('Un nouveau chemin a été tracé.');}else if(form.id==='step-form'){let s=addStep(state,form.dataset.mission,val('title'));closeModal();persist(s);notify('Passage ajouté sur ta carte.');}else if(form.id==='action-form'){let s=addAction(state,{title:val('title'),horizon:val('horizon'),missionId:val('missionId')||null});closeModal();persist(s);notify('Ton engagement est prêt.');}else if(form.id==='note-form'){let s=addNote(state,{text:val('text'),emotion:val('emotion'),missionId:val('missionId'),image:photoPending});closeModal();persist(s);navigate('carnet');notify('Souvenir conservé dans ton Carnet.');}else if(form.id==='book-form'){let s=addBook(state,val('title'),val('author'),val('status'),bookCoverPending,val('pagesTotal'),val('currentPage'));closeModal();persist(s);bookCoverPending=null;navigate('bibliotheque');notify('Le livre rejoint ta bibliothèque.');}else if(form.id==='book-progress-form'){let s=updateBook(state,form.dataset.book,{pagesTotal:val('pagesTotal'),currentPage:val('currentPage'),status:val('status')});persist(s);state=s;openBook(form.dataset.book);notify('Progression du livre mise à jour.');}else if(form.id==='book-entry-form'){let s=addBookEntry(state,form.dataset.book,{text:val('text'),analysis:val('analysis'),favorite:fd.get('favorite')==='on',image:bookCoverPending||''});persist(s);bookCoverPending=null;state=s;openBook(form.dataset.book);notify('Note ajoutée dans le dossier du livre.');}else if(form.id==='checkin-form'){let s=addCheckin(state,{missionId:form.dataset.mission,feeling:val('feeling'),difficulty:val('difficulty'),nextAction:val('nextAction'),scheduledFor:val('scheduledFor')});closeModal();persist(s);navigate('mission/'+form.dataset.mission);notify('Bilan conservé dans cette Mission.');}else if(form.id==='essay-draft-form'){let s=saveEssay(state,{title:val('title'),category:val('category'),text:val('text'),bookTitle:val('bookTitle')});closeModal();persist(s);navigate('bibliotheque');notify('Réflexion sauvegardée en privé.');}else if(form.id==='recover-form'){let s=markRecovery(state,form.dataset.mission,val('reason'),val('plan'));closeModal();persist(s);navigate('mission/'+form.dataset.mission);notify('Ta reprise figure désormais dans la mémoire de cette Mission.');}else if(form.id==='auth-form'){if(!cloudStore)throw Error('Cloud non activé');const email=val('email'),password=val('password');if(val('intent')==='signup'){const res=await cloudStore.signUp(email,password);if(res==='check_email'){closeModal();notify('Vérifie ton e-mail pour confirmer le compte. Ton Atlas reste sur cet appareil.');return;}}else await cloudStore.signIn(email,password);closeModal();await afterAuth();}}catch(err){console.error('ATLAS form',err);notify(err.message||'Une erreur est survenue.');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialogs.querySelector('#overlay'))closeModal();});
// Fin de lecture : une sélection « Terminé » remplit immédiatement les pages.
dialogs.addEventListener('change',e=>{
  const select=e.target.closest('#book-progress-form select[name="status"], #book-form select[name="status"]');
  if(!select)return;
  const form=select.form;const total=Number(form?.elements?.pagesTotal?.value||0);
  if(select.value==='finished'&&total>0){form.elements.currentPage.value=String(total);}
  if(select.value==='to-read'){form.elements.currentPage.value='0';}
});
dialogs.addEventListener('input',e=>{
  const el=e.target;
  const form=el.closest('#book-progress-form,#book-form');
  if(!form||!['currentPage','pagesTotal'].includes(el.name))return;
  const total=Number(form.elements.pagesTotal?.value||0), page=Number(form.elements.currentPage?.value||0);
  const select=form.elements.status;
  if(select&&total>0){
    if(page>=total)select.value='finished';
    else if(select.value==='finished'&&page<total)select.value=page>0?'reading':'to-read';
  }
});

window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
render();if(!localOK)setTimeout(()=>notify('Mode privé : exporte ton Atlas avant de fermer le navigateur.'),800);
// Réévalue les périodes quand on revient sur l'application après un changement de date.
let lastPeriods=['day','week','month'].map(periodKey).join('|');
function refreshPeriods(){const current=['day','week','month'].map(periodKey).join('|');if(current!==lastPeriods){lastPeriods=current;render();notify('Une nouvelle période commence. Ton historique est conservé.');}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshPeriods();});
window.addEventListener('focus',refreshPeriods);
setInterval(refreshPeriods,60000);
if(cloudStore){cloudStore.session().then(async u=>{
 switchAtlasAccount(u);
 if(u){const remote=await cloudStore.load();if(session?.id!==u.id)return;
  if(remote){state=remote;saveLocal(state);render();}}
}).catch(err=>console.warn('ATLAS session',err));}
